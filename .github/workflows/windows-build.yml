name: Windows build

# Flutter не умеет кросс-компилировать .exe с macOS/Linux — этот файл
# существует именно затем, чтобы сборку делал раннер GitHub (настоящая
# Windows), а не локальная машина.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: bible_reflection-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
