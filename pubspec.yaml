name: bible_reflection
description: "Размышления над Библией — отрывок дня, личные заметки и напоминания."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Бэкенд (аккаунты, тройки, обмен заметками)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0

  # Системное «Поделиться» (приглашение в тройку)
  share_plus: ^10.0.0

  # Открытие ссылок
  url_launcher: ^6.3.0

  # Встроенный аудиозвонок тройки
  agora_rtc_engine: 6.5.4
  permission_handler: ^11.3.0

  # Локальная база (заметки + расписание отрывков)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Настройки (время напоминаний и т.п.)
  shared_preferences: ^2.3.2

  # Локальные напоминания
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Форматирование дат (русская локаль)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bible/
