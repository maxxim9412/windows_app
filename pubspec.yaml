name: bible_reflection
description: "Размышления над Библией — отрывок дня, личные заметки и напоминания."
publish_to: 'none'
version: 0.6.1+26

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Бэкенд (аккаунты, тройки, обмен заметками)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0

  # Системное «Поделиться» (приглашение в тройку)
  share_plus: ^10.0.0

  # Открытие ссылок
  url_launcher: ^6.3.0

  # Своя версия приложения — для проверки обновлений
  package_info_plus: ^8.0.0

  # Встроенный аудиозвонок тройки
  agora_rtc_engine: 6.5.4
  permission_handler: ^11.3.0
  agora_token_service: ^0.1.2
  audioplayers: ^6.1.0

  # Локальная база (заметки + расписание отрывков)
  sqflite: ^2.3.3
  sqflite_common_ffi_web: ^0.4.5  # SQLite в вебе
  path: ^1.9.0
  path_provider: ^2.1.4

  # Настройки (время напоминаний и т.п.)
  shared_preferences: ^2.3.2

  # Локальные напоминания
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Форматирование дат (русская локаль)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Иконка приложения. Положите PNG 1024x1024 в assets/icon/icon.png и выполните:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/bible/
    - assets/sounds/
